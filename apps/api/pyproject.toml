[project]
name = "crucible-api"
version = "0.1.0"
description = "FastAPI HTTP/SSE gateway. Composition root: wires adapters into application ports."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<7",
    "arq>=0.26,<1",
    "crucible-domain",
    "crucible-application",
    "crucible-db",
    "crucible-security",
    "crucible-storage",
    "crucible-observability",
]

[tool.uv.sources]
crucible-domain = { workspace = true }
crucible-application = { workspace = true }
crucible-db = { workspace = true }
crucible-security = { workspace = true }
crucible-storage = { workspace = true }
crucible-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_api"]
