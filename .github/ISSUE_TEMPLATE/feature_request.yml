name: Feature request
description: Propose a capability or change. Please check the roadmap first.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Crucible v1 is deliberately scoped to one bounded workload (a data-analysis
        agent over uploaded tabular data). Please review the **Non-goals** in the
        [README](https://github.com/saiabhinav001/crucible/blob/main/README.md#non-goals--limitations)
        and the [roadmap](https://github.com/saiabhinav001/crucible/blob/main/docs/product/backlog.md)
        before proposing — some ideas are intentionally out of scope for v1.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user problem does this solve? Who hits it, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Note any evaluation/security/tenancy impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require arbitrary shell, package install, web browsing, or unrestricted network access from generated code.
        - label: I have read the Non-goals and this is not an explicitly excluded capability.
