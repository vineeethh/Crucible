[project]
name = "crucible-evaluation"
version = "0.1.0"
description = "Offline evaluation harness: versioned cases, scorers, paired-CI comparison, gate."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "crucible-domain",
    "crucible-execution",
    "crucible-agent",
]

[tool.uv.sources]
crucible-domain = { workspace = true }
crucible-execution = { workspace = true }
crucible-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
