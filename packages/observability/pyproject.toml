[project]
name = "crucible-observability"
version = "0.1.0"
description = "Telemetry conventions, redaction, trace/metrics aggregation, SLIs and alerts."
requires-python = ">=3.12"
dependencies = ["crucible-domain"]

[tool.uv.sources]
crucible-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
