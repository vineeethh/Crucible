[project]
name = "crucible-agent"
version = "0.1.0"
description = "Durable data-agent graph: typed nodes, model gateway, verification, provenance."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27",
    "polars>=1.17,<2",
    "crucible-domain",
    "crucible-execution",
]

[tool.uv.sources]
crucible-domain = { workspace = true }
crucible-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
