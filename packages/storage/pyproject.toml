[project]
name = "crucible-storage"
version = "0.1.0"
description = "Object-storage adapter (S3-compatible: MinIO locally, GCS/S3 in cloud)."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "polars>=1.17,<2",
    "crucible-domain",
]

[tool.uv.sources]
crucible-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
