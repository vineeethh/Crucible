[project]
name = "crucible-security"
version = "0.1.0"
description = "Authn/authz helpers: API-key hashing, OIDC JWT verification, rate limits, audit."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=5.2,<7",
    "crucible-domain",
]

[tool.uv.sources]
crucible-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
