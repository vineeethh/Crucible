[project]
name = "crucible-application"
version = "0.1.0"
description = "Use cases and ports. Depends only on crucible-domain and the standard library."
requires-python = ">=3.12"
dependencies = ["crucible-domain"]

[tool.uv.sources]
crucible-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
