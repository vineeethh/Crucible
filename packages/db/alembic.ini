# Alembic configuration for Crucible.
# Invoke from repo root:  uv run alembic -c packages/db/alembic.ini upgrade head
# The URL below is a non-secret local-compose default; DATABASE_URL overrides it
# (see packages/db/alembic/env.py). Migrations run as an explicit deploy step,
# never implicitly on app startup (master plan §5.4).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://crucible:crucible@localhost:55432/crucible

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
