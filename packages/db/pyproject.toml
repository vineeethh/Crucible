[project]
name = "crucible-db"
version = "0.1.0"
description = "SQLAlchemy models, engine factories, and Alembic migrations."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "crucible-domain",
    "crucible-application",
]

[tool.uv.sources]
crucible-domain = { workspace = true }
crucible-application = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
