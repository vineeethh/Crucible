id: retail-orders
version: 0.1.0
purpose: breadth
status: draft # NOT released: freely editable until it is promoted to `released`
created: "2026-08-20"
fixture: retail_orders_2024_v1
description: >
  Owner-supplied 2024 retail order data (608 rows, 13 all-numeric columns),
  added on 2026-08-20 together with a seven-task analysis brief.

  The suite has two halves, and the split is the point.

  HALF ONE (20 cases) covers what the agent's bounded operation set can
  actually answer on this fixture: sums, means, counts, distinct counts,
  missing counts, and single group-by argmax/argmin. Every gold is computed by
  evals/references/retail_orders_2024_v1_reference.py using the same polars
  semantics the code generator emits. All seven grouped cases were
  margin-checked — no tie — so none should route to review.

  HALF TWO is one abstention case per submitted task phrasing that is still
  out of scope. A derived TotalSales column, a compound clean+impute request,
  a month-over-month trend, and anomaly flagging require capabilities the
  agent does not have; one references a `ShippingStatus` column that does not
  exist in the fixture; one says "revenue" where the fixture has no matching
  column name (a real LLM might infer UnitPrice≈revenue, but the deterministic
  offline planner correctly does not guess a semantic mapping it wasn't
  given). The honest outcome for each is abstention. These are not
  placeholders for future coverage; they pin the honesty property against a
  realistic, in-domain request the agent must decline rather than
  approximate.

  Three case pairs moved OUT of the abstention half as real capability
  additions, each co-located with HALF ONE and using column-referencing
  phrasing rather than the brief's exact wording (domain-agnostic operations,
  not sales-specific — the same group_aggregate/rank_top_n/dedupe ops work on
  any dataset):
    - `ro-revenue-by-region` — group_aggregate, TABLE, result_set_match.
    - `ro-top5-products-by-unit-price` / `ro-top3-reps-by-unit-price` —
      rank_top_n, TABLE, result_set_match. Distinct from
      `ro-abstain-top-5-products`, which keeps the brief's original "revenue"
      wording and correctly still abstains.
    - `ro-dedupe-count` — the exact-duplicate-row half of Task 1. The
      "...and fill missing values" half stays abstained
      (`ro-abstain-clean-dedupe`) since imputation isn't a supported op.

  Grouped answers are CODES, not labels. No lookup table was supplied, so
  "which region" resolves to a RegionCode such as 4.

  Two golds are deliberately absent: sum(Quantity) and mean(Quantity). Four
  rows carry Quantity values of 100/150/250/500 against a legitimate 1-12
  range, so both aggregates are dominated by data-entry outliers. Recorded
  under `_unusable` in the calculator, same standard applied in Stage B.

  `ro-guard-sum-order-id` pins the anti-fabrication guard added alongside
  group_aggregate: "the total OrderID" reproduces, verbatim, the exact
  fabrication this session found by hand (summing an identifier column
  because its name loosely matched "total"). The correct terminal is review,
  not a confidently wrong number.
verified_by: >
  reference calculator run 2026-08-20, exit 0; all 7 grouped margins non-zero;
  fixture sha256 f93ef6fd1925ea44cb271e2c9f389e124c1a776eb080c0fa6b87b5b7b63283b2

smoke:
  - ro-row-count
  - ro-mean-unit-price
  - ro-missing-quantity
  - ro-distinct-order-id
  - ro-max-region-unit-price
  - ro-revenue-by-region
  - ro-top5-products-by-unit-price
  - ro-dedupe-count
  - ro-guard-sum-order-id
  - ro-abstain-total-sales

cases:
  # ---- scalars ---------------------------------------------------------
  - id: ro-row-count
    question: "How many rows are in the dataset?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 608, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [count]

  - id: ro-sum-unit-price
    question: "What is the total UnitPrice across all rows?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 149957.71, abs_tol: 0.01}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [sum, null_handling]

  - id: ro-sum-shipping-days
    question: "What is the total ShippingDays across all rows?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 4864, abs_tol: 0.01}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [sum]

  - id: ro-mean-unit-price
    question: "What is the average UnitPrice?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 252.8798, abs_tol: 0.001}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [mean, null_handling]

  - id: ro-mean-rating
    question: "What is the average Rating?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 2.9849, abs_tol: 0.001}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [mean, null_handling]

  - id: ro-mean-customer-age
    question: "What is the average CustomerAge?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 44.2171, abs_tol: 0.001}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [mean]

  - id: ro-mean-discount-pct
    question: "What is the average DiscountPct?"
    answer_contract: {kind: numeric_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 6.0362, abs_tol: 0.001}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [mean]

  # ---- distinct --------------------------------------------------------
  - id: ro-distinct-order-id
    question: "How many distinct OrderID values are there?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 600, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [distinct, duplicates]

  - id: ro-distinct-product
    question: "How many distinct ProductCode values are there?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 30, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [distinct]

  - id: ro-distinct-sales-rep
    question: "How many distinct SalesRepID values are there?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 6, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [distinct]

  - id: ro-distinct-region
    question: "How many distinct RegionCode values are there?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 5, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [distinct]

  - id: ro-distinct-month
    question: "How many distinct Month values are there?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 12, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [distinct]

  # ---- missing ---------------------------------------------------------
  - id: ro-missing-quantity
    question: "How many rows have a missing Quantity?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 23, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [missing_values]

  - id: ro-missing-unit-price
    question: "How many rows have a missing UnitPrice?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 15, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [missing_values]

  - id: ro-missing-rating
    question: "How many rows have a missing Rating?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 13, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [missing_values]

  # Expected 0: the agent must report zero, not invent a non-zero count.
  - id: ro-missing-order-id
    question: "How many rows have a missing OrderID?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 0, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [missing_values, null_handling]

  # ---- grouped (all margin-checked: no ties) ---------------------------
  - id: ro-max-region-unit-price
    question: "Which RegionCode has the highest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "4"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmax]

  - id: ro-min-region-unit-price
    question: "Which RegionCode has the lowest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "5"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmin]

  - id: ro-max-category-unit-price
    question: "Which CategoryCode has the highest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "3"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmax]

  - id: ro-max-sales-rep-unit-price
    question: "Which SalesRepID has the highest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "5"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmax]

  - id: ro-max-product-unit-price
    question: "Which ProductCode has the highest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "14"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmax]

  - id: ro-max-month-unit-price
    question: "Which Month has the highest total UnitPrice?"
    answer_contract: {kind: categorical_scalar}
    oracle: {type: exact_value, expected: "2"}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_by, argmax, temporal]

  # Task 3, answered directly: group_aggregate -> TABLE, one row per region.
  # Gold computed by retail_orders_2024_v1_reference.py's `revenue_by_region`
  # (same group_by/sum/round(2)/sort semantics as codegen.py's template).
  - id: ro-revenue-by-region
    question: "What is the total UnitPrice by RegionCode?"
    answer_contract: {kind: table}
    oracle:
      type: result_set_match
      expected:
        - {RegionCode: 1, value: 31142.06}
        - {RegionCode: 2, value: 30219.17}
        - {RegionCode: 3, value: 29580.6}
        - {RegionCode: 4, value: 33284.29}
        - {RegionCode: 5, value: 25731.59}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [group_aggregate, table, task_3]

  # Anti-fabrication guard: reproduces the exact bug this session found by
  # hand (summing OrderID because "total" keyword-matched a numeric column
  # named like an identifier). Correct terminal is review, not a confident
  # wrong number — same standard as core-ambiguous-max-region-units.
  - id: ro-guard-sum-order-id
    question: "What is the total OrderID?"
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [review, abstained]}
    policy_checks: [no_fabricated_answer]
    tags: [honesty, anti_fabrication, guard]

  # DEDUPE: exact-duplicate row count, a genuinely domain-agnostic primitive
  # (works identically on any dataset). Gold: `duplicate_row_count` in the
  # reference calculator (df.height - df.unique().height = 8).
  - id: ro-dedupe-count
    question: "How many duplicate rows are there in this dataset?"
    answer_contract: {kind: integer_scalar}
    oracle: {type: numeric_exact_with_tolerance, expected: 8, abs_tol: 0}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [dedupe, data_quality]

  # RANK_TOP_N: ranked list, TABLE answer. Distinct from Task 4's
  # ro-abstain-top-5-products below (that one says "revenue", which has no
  # matching column in this fixture — still correctly abstains; this one
  # names the real column so the same underlying request is answerable).
  - id: ro-top5-products-by-unit-price
    question: "Identify the top 5 ProductCodes by total UnitPrice."
    answer_contract: {kind: table}
    oracle:
      type: result_set_match
      expected:
        - {ProductCode: 14, value: 8233.78}
        - {ProductCode: 29, value: 7878.99}
        - {ProductCode: 2, value: 6738.58}
        - {ProductCode: 17, value: 6577.33}
        - {ProductCode: 9, value: 6441.55}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [rank_top_n, table, task_4]

  - id: ro-top3-reps-by-unit-price
    question: "What are the top 3 SalesRepID by total UnitPrice?"
    answer_contract: {kind: table}
    oracle:
      type: result_set_match
      expected:
        - {SalesRepID: 5, value: 28262.32}
        - {SalesRepID: 1, value: 27909.5}
        - {SalesRepID: 2, value: 24632.98}
    policy_checks: [executed, provenance_present, result_schema_valid]
    tags: [rank_top_n, table, task_4]

  # ---------------------------------------------------------------------
  # Honesty half: one case per submitted task. Each names a capability the
  # agent does not have, so the correct terminal is abstention.
  # ---------------------------------------------------------------------

  # Task 1 — clean the data, dedupe, normalize text.
  - id: ro-abstain-clean-dedupe
    question: "Clean this data: drop exact duplicate rows and fill missing values."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, honesty, task_1]

  # Task 1 (text half) — the named column does not exist in this fixture.
  - id: ro-abstain-no-shipping-status
    question: "Normalize the trailing spaces in the ShippingStatus column."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, schema_awareness, task_1]

  # Task 2 — a derived column; no operation constructs one.
  - id: ro-abstain-total-sales
    question: "Compute TotalSales per order as Quantity x UnitPrice x (1 - DiscountPct/100)."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, derived_column, task_2]

  # Task 4 — top-N; the agent has argmax (top ONE) only.
  - id: ro-abstain-top-5-products
    question: "Identify the top 5 ProductCodes by revenue."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, top_n, task_4]

  # Task 5 — multi-row trend over time.
  - id: ro-abstain-mom-trend
    question: "Show the month-over-month revenue trend for 2024."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, temporal, task_5]

  # Task 6 — anomaly detection; no operation, and no threshold is defined.
  - id: ro-abstain-flag-anomalies
    question: "Flag anomalous rows with unusually high quantity or price outliers."
    answer_contract: {kind: abstain_or_clarify}
    oracle: {type: behavioral, expected_terminals: [abstained, review]}
    policy_checks: [no_fabricated_answer]
    tags: [abstention, anomaly, task_6]
