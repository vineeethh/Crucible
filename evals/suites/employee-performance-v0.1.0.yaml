id: employee-performance
version: 0.1.0
purpose: breadth
status: draft # NOT released: freely editable until it is promoted to `released`
created: "2026-08-20"
fixture: employee_performance_2024
description: >
  Owner-supplied 2024 employee performance data (557 rows, 13 columns), added
  on 2026-08-20 with a seven-task analysis brief. Run AS-IS against the
  system unmodified — no planner/codegen change was made to accommodate this
  fixture's wording. Where a natural phrasing exposes a genuine bug rather
  than a missing capability, that case is included and expected to FAIL, on
  purpose, so the failure is a recorded, reproducible finding rather than
  something quietly avoided by picking friendlier wording.

  THREE GROUPS of cases:

  WORKING — genuinely correct, verified against the reference calculator:
  duplicate/missing counts, a sentinel-value count when phrased with an
  explicit "where" clause, and seven mean/count group_aggregate breakdowns
  (Task 2's four department/job-level breakdowns, Task 7's three department
  breakdowns — as three SEPARATE tables: group_aggregate has one reducer per
  call, so Task 7's single combined table is not producible in one query).

  CORRECTLY ABSTAINS — Tasks 3, 5, 6 (correlation, attrition-risk criteria,
  IQR outlier detection) have no matching operation and honestly decline.
  Headcount-by-department also abstains: the fake planner's "X by Y" pattern
  requires a numeric column to reduce, and has no bare "count members per
  group" path yet.

  BUGS FOUND, not fixed (the CSV was uploaded to test the system as it
  stands, not to have the system tuned to fit it — these are reported, not
  patched):
    - `ep-finding-999-no-where` / `ep-finding-negative-no-where`: the fake
      planner's COUNT-with-filter parser ONLY recognizes an explicit
      "where/with/for <col> is/= <value>" clause. Ask the same question
      without that clause ("how many rows have X is 999") and it silently
      returns the FULL row count (557) instead of abstaining or filtering —
      a confidently wrong answer, not a missing capability. There is also no
      "<" / ">" comparison phrasing at all, so "negative AbsenceDays" can
      never be expressed as a filter regardless of wording.
    - `ep-finding-ranking-with-qualifier`: asked to rank managers "with at
      least 3 direct reports, top 5 and bottom 5", the planner extracts only
      "top 5" and silently drops both the minimum-team-size qualifier and
      the bottom-5 half, then answers confidently — a materially different,
      narrower question than the one asked, with no indication anything was
      dropped.
    - `ep-finding-summary-table-per-phrasing`: "per DepartmentCode" (Task 7's
      own wording) is not recognized as a grouping keyword — only literal
      " by " is. Combined with three requested metrics in one sentence, the
      planner falls through to the plain MEAN branch and returns the average
      of the DepartmentCode CODE NUMBER itself — a nonsensical value,
      confidently presented as an answer. The anti-fabrication guard does
      not catch it: it only recognizes "*id"-suffixed names as
      identifier-shaped, not "*Code" columns (DepartmentCode, ProductCode,
      CategoryCode) — a real gap in the guard, found by this fixture.
verified_by: >
  reference calculator run 2026-08-20, exit 0;
  fixture sha256 cef340dc86817962c3dc77542df838c2514ab068e20de83f15151accc4c06ff3

smoke:
  - ep-row-count
  - ep-dedupe-count
  - ep-mean-performance-by-department
  - ep-finding-999-no-where
  - ep-finding-ranking-with-qualifier

cases:
  # ---------------------------------------------------------------- WORKING
