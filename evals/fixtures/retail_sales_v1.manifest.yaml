id: retail_sales_v1
kind: dataset_fixture
version: 1.0.0
file: retail_sales_v1.csv
sha256: "347e147d4e1f5709250a759f56924c837adc5d24795ded8d8964e6dcc9d6c849"
rows: 40
# dtypes are what `polars.read_csv(infer_schema_length=10000)` actually infers
# (verified, not assumed) — the same call the agent's generated code makes, so
# the planner sees the same numeric/categorical split the sandbox will.
# Note order_date infers as String, NOT Date: the agent has no date operations,
# so it is a categorical column as far as the planner is concerned.
columns:
  - {name: order_id,    dtype: String}   # unique per row
  - {name: order_date,  dtype: String}   # ISO yyyy-mm-dd, 2024-01..2024-09
  - {name: region,      dtype: String}   # North/South/East/West; 1 empty (ORD-1023)
  - {name: category,    dtype: String}   # Electronics / Furniture / Office Supplies
  - {name: product,     dtype: String}   # 12 distinct
  - {name: quantity,    dtype: Int64}    # positive
  - {name: unit_price,  dtype: Float64}  # USD
  - {name: discount,    dtype: Float64}  # fraction 0..1; 4 rows intentionally empty
  - {name: customer_id, dtype: String}   # 32 distinct; several repeat buyers
provenance:
  source: "Fully synthetic; hand-authored for the Crucible Phase 0 seed suite on 2026-07-14."
  license: "Project-owned synthetic data; no real persons, prices, or transactions."
  pii: none
  sensitive: false
intentional_edge_cases:
  - "4 empty discount cells (ORD-1003, ORD-1007, ORD-1017, ORD-1032)"
  - "1 empty region cell (ORD-1023) — excluded from region groupings, included in totals"
  - "no cost/margin column — supports the invalid-question abstention case (seed-10)"
  - "repeat customer_ids to distinguish row count from distinct count"
# Consequences of the empty region cell, under the agent's own polars semantics.
# Both are honest behaviour, not bugs — they are simply not defensible as golds,
# so retail-v1.0.0 groups by `category` instead. See the reference calculator's
# `_unusable` block.
excluded_from_suite:
  - "distinct region: n_unique() counts null as a value -> 5, where a reader defends 4"
  - "min region by unit_price: the smallest group IS the null group -> answer 'None'"
reference: evals/references/retail_sales_v1_reference.py
canonicalization_contract: "See evals/references/_common.py docstring; changes require a new fixture/suite version."
